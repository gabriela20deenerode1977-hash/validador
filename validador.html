<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validador PRO</title>

<style>
body {
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
}

video {
  width:90%;
  max-width:400px;
  border-radius:10px;
  margin-top:20px;
  border:3px solid #0f0;
}

#resultado {
  margin-top:20px;
  font-size:22px;
  font-weight:bold;
}

.ok { color:#00ff00; }
.error { color:red; }

button {
  margin-top:10px;
  padding:10px 20px;
  border:none;
  border-radius:8px;
  background:#ffcc00;
}
</style>
</head>

<body>

<h2>📷 Escanear QR</h2>

<video id="video" playsinline></video>

<br>
<button onclick="cambiarCamara()">🔄 Cambiar cámara</button>

<div id="resultado">Apuntá al QR</div>

<!-- LIBRERÍA QR (MEJOR) -->
<script src="https://cdn.jsdelivr.net/npm/qr-scanner/qr-scanner.umd.min.js"></script>

<script>
const video = document.getElementById("video");
const resultado = document.getElementById("resultado");

let currentCamera = "environment";
let scanner;

function iniciarScanner() {

  if (scanner) {
    scanner.stop();
  }

  scanner = new QrScanner(
    video,
    result => {
      validarQR(result.data);
    },
    {
      preferredCamera: currentCamera,
      highlightScanRegion: true,
      highlightCodeOutline: true
    }
  );

  scanner.start();
}

function cambiarCamara() {
  currentCamera = currentCamera === "environment" ? "user" : "environment";
  iniciarScanner();
}

function validarQR(data) {

  scanner.stop(); // 🔥 evita lecturas múltiples

  resultado.innerText = "⏳ Validando...";
  resultado.className = "";

  fetch("https://script.google.com/macros/s/AKfycbxoH0OTGnOEOHFCXrxOKDjuflGaJ3pJZIjRitz_RfsJudlWYY04MRcfvw9ImEXoCQrf/exec?codigo=" + data)
  .then(res => res.text())
  .then(res => {

    if (res.includes("VALIDO")) {
      resultado.innerText = "✅ CUPÓN VÁLIDO";
      resultado.className = "ok";

      if (navigator.vibrate) navigator.vibrate(200);

    } else {
      resultado.innerText = "❌ CUPÓN USADO / INVÁLIDO";
      resultado.className = "error";
    }

    // 🔁 vuelve a escanear en 3 seg
    setTimeout(() => {
      resultado.innerText = "Apuntá al QR";
      iniciarScanner();
    }, 3000);

  })
  .catch(() => {
    resultado.innerText = "❌ Error conexión";
    resultado.className = "error";

    setTimeout(() => iniciarScanner(), 3000);
  });
}

// iniciar
iniciarScanner();
</script>

</body>
</html>
