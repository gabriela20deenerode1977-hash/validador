<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanner GNC</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; text-align: center; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: 20px auto; background: #000; border-radius: 10px; }
        .btn { padding: 15px 30px; background: #f1c40f; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }
        #resultado { display: none; background: #2d2d2d; padding: 20px; border-radius: 15px; margin-top: 20px; }
        input { width: 80%; padding: 10px; margin: 10px 0; font-size: 18px; }
    </style>
</head>
<body>
    <h2>Validador de Cupones</h2>
    <div id="reader"></div>
    <button id="btn-start" class="btn" onclick="iniciar()">📷 ACTIVAR CÁMARA</button>

    <div id="resultado">
        <h3 style="color: #2ecc71;">CUPÓN LEÍDO</h3>
        <p id="info-cupon"></p>
        <label>Monto Carga ($):</label><br>
        <input type="number" id="monto" oninput="calcular()">
        <h2 id="total-pagar">Total: $0</h2>
        <button class="btn" style="background:#2ecc71" onclick="location.reload()">NUEVA VENTA</button>
    </div>

    <script>
        let porcentaje = 0;
        function iniciar() {
            document.getElementById('btn-start').style.display = 'none';
            const scanner = new Html5Qrcode("reader");
            scanner.start({ facingMode: "environment" }, { fps: 10, qrbox: 250 }, 
            (text) => {
                scanner.stop();
                document.getElementById('reader').style.display = 'none';
                document.getElementById('resultado').style.display = 'block';
                
                // Extraer datos simple
                const data = text.split('|');
                document.getElementById('info-cupon').innerText = text.replace(/\|/g, ' - ');
                porcentaje = parseInt(text.split('PREMIO:')[1]) || 0;
            });
        }

        function calcular() {
            const m = document.getElementById('monto').value || 0;
            const final = m - (m * porcentaje / 100);
            document.getElementById('total-pagar').innerText = "Total a Cobrar: $" + final.toFixed(2);
        }
    </script>
</body>
</html>
