<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador Oficial GNC</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --bg: #1a1a1a;
            --card: #2d2d2d;
            --text: #ffffff;
            --accent: #f1c40f;
            --success: #27ae60;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg); 
            color: var(--text); 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
        }

        .container { width: 100%; max-width: 500px; background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }

        h2 { text-align: center; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; letter-spacing: 2px; }

        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px solid var(--accent) !important; }

        .stats-grid { display: flex; gap: 10px; margin: 20px 0; }
        .stat-box { flex: 1; background: #3d3d3d; padding: 10px; border-radius: 10px; text-align: center; border-bottom: 3px solid var(--accent); }
        .stat-val { display: block; font-size: 20px; font-weight: bold; }
        .stat-lbl { font-size: 10px; color: #bbb; text-transform: uppercase; }

        .history-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
        .history-table th { background: #3d3d3d; color: var(--accent); padding: 10px; text-align: left; }
        .history-table td { padding: 10px; border-bottom: 1px solid #3d3d3d; }

        /* SECCIÓN DE DESCARGA (LO QUE PEDISTE) */
        .download-zone { 
            margin-top: 30px; 
            padding: 15px; 
            background: #252525; 
            border-radius: 10px; 
            border: 1px dashed var(--accent);
        }
        
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; margin-bottom: 5px; color: var(--accent); }
        .input-group input { 
            width: 100%; 
            padding: 10px; 
            background: #333; 
            border: 1px solid #444; 
            color: white; 
            border-radius: 5px; 
            box-sizing: border-box;
        }

        .btn { 
            width: 100%; 
            padding: 15px; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            text-transform: uppercase;
            transition: 0.3s;
        }
        .btn-download { background: var(--success); color: white; margin-bottom: 10px; }
        .btn-download:hover { background: #219150; }
    </style>
</head>
<body>

<div class="container">
    <h2>Validador GNC</h2>

    <div id="reader"></div>

    <div class="stats-grid">
        <div class="stat-box">
            <span id="count-total" class="stat-val">0</span>
            <span class="stat-lbl">Cupones</span>
        </div>
        <div class="stat-box">
            <span id="last-time" class="stat-val">--:--</span>
            <span class="stat-lbl">Última Hora</span>
        </div>
    </div>

    <table class="history-table">
        <thead>
            <tr>
                <th>Hora</th>
                <th>Patente</th>
                <th>Premio</th>
            </tr>
        </thead>
        <tbody id="log-body"></tbody>
    </table>

    <div class="download-zone">
        <div class="input-group">
            <label>Nombre del Archivo Personalizado:</label>
            <input type="text" id="fileNameInput" placeholder="Ej: Lunes_Turno_Mañana">
        </div>
        
        <button onclick="descargarYLimpiar()" class="btn btn-download">
            📥 Descargar Reporte y Limpiar
        </button>
    </div>
</div>

<script>
    // Inicialización del Lector QR
    const html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess);

    function onScanSuccess(decodedText) {
        // Formato esperado: ID:GNC-XXXX|VAL:10% (Ejemplo)
        // Aquí podrías agregar un sonido de "bip"
        const ahora = new Date();
        const horaString = ahora.getHours() + ":" + ahora.getMinutes().toString().padStart(2, '0');
        
        // Simulación de captura (aquí deberías parsear el QR si viene con datos específicos)
        // Para este ejemplo, creamos un registro cada vez que escanea algo:
        const nuevaValidacion = {
            hora: horaString,
            patente: "ESCANEADO", // Aquí podrías extraer la patente del QR si lo incluyes
            premio: decodedText.split('|')[1]?.replace('VAL:', '') || "DESC",
            id: decodedText.split('|')[0] || "ID-NEW"
        };

        guardarValidacion(nuevaValidacion);
    }

    function guardarValidacion(item) {
        let historial = JSON.parse(localStorage.getItem('gnc_validaciones') || '[]');
        historial.push(item);
        localStorage.setItem('gnc_validaciones', JSON.stringify(historial));
        renderTable();
    }

    function renderTable() {
        const datos = JSON.parse(localStorage.getItem('gnc_validaciones') || '[]');
        const cuerpo = document.getElementById('log-body');
        document.getElementById('count-total').innerText = datos.length;
        
        if(datos.length > 0) {
            document.getElementById('last-time').innerText = datos[datos.length - 1].hora;
        }

        cuerpo.innerHTML = datos.reverse().slice(0, 5).map(d => `
            <tr>
                <td>${d.hora}</td>
                <td style="color:var(--accent)">${d.patente}</td>
                <td>${d.premio}</td>
            </tr>
        `).join('');
    }

    // --- FUNCIÓN DE DESCARGA Y LIMPIEZA (LO QUE PEDISTE) ---
    function descargarYLimpiar() {
        const datos = JSON.parse(localStorage.getItem('gnc_validaciones') || '[]');
        
        if (datos.length === 0) {
            alert("No hay datos para descargar.");
            return;
        }

        // 1. Obtener nombre del archivo
        let nombreManual = document.getElementById('fileNameInput').value.trim();
        if (!nombreManual) {
            const f = new Date();
            nombreManual = `Reporte_GNC_${f.getDate()}-${f.getMonth()+1}`;
        }

        // 2. Crear CSV
        let csv = "Hora,Patente,Premio,ID\n";
        datos.forEach(d => {
            csv += `${d.hora},${d.patente},${d.premio},${d.id}\n`;
        });

        // 3. Descargar
        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `${nombreManual}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        // 4. Limpiar historial tras confirmación
        setTimeout(() => {
            if (confirm("¿Descarga completada? El historial se borrará para el siguiente turno.")) {
                localStorage.removeItem('gnc_validaciones');
                document.getElementById('fileNameInput').value = "";
                renderTable();
            }
        }, 1000);
    }

    // Carga inicial
    window.onload = renderTable;
</script>

</body>
</html>
