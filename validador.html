<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador GNC - Historial Seguro</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --accent: #f1c40f;
            --success: #27ae60;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h2 { text-align: center; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 10px; }
        
        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px solid #444; background: #000; margin-bottom: 15px; }

        .step-box { background: #252525; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
        .label-step { color: var(--accent); font-weight: bold; font-size: 11px; display: block; margin-bottom: 10px; text-transform: uppercase; }
        
        input { width: 100%; padding: 15px; background: #333; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; font-size: 24px; text-align: center; outline: none; font-weight: bold; }
        input:disabled { opacity: 0.2; }

        .result-display { background: var(--success); color: white; padding: 15px; border-radius: 10px; text-align: center; margin-top: 15px; display: none; }
        .result-display div { font-size: 32px; font-weight: 900; }

        .btn { width: 100%; padding: 18px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 15px; margin-top: 10px; }
        .btn-confirm { background: var(--success); color: white; border: 2px solid #fff; }
        .btn-export { background: #444; color: #ccc; margin-top: 25px; font-size: 12px; }

        .totales-resumen { display: flex; gap: 10px; margin: 20px 0; }
        .total-box { flex: 1; background: #252525; padding: 10px; border-radius: 10px; text-align: center; border-bottom: 3px solid var(--accent); }
        .total-val { display: block; font-size: 18px; font-weight: bold; color: #fff; }

        table { width: 100%; border-collapse: collapse; font-size: 11px; color: #aaa; margin-top: 10px; }
        th { text-align: left; padding: 8px; border-bottom: 1px solid #333; color: var(--accent); }
        td { padding: 8px; border-bottom: 1px solid #222; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Validador GNC - Estación</h2>

    <div id="step-1" class="step-box">
        <span class="label-step">1. ESCANEAR CUPÓN</span>
        <div id="reader"></div>
        <p id="status-qr" style="text-align: center; font-size: 13px; color: #888;">[ ESCÁNER ACTIVO ]</p>
    </div>

    <div id="step-2" class="step-box">
        <span class="label-step">2. MONTO DE CARGA ($)</span>
        <input type="number" id="inputMonto" placeholder="0.00" disabled oninput="calcularDescuento()">
        
        <div id="displayCalculo" class="result-display">
            <small id="infoDescuento"></small>
            <div id="montoFinal">$ 0,00</div>
            <small>MONTO A COBRAR AL CLIENTE</small>
        </div>

        <button id="btnFinalizar" class="btn btn-confirm hidden" onclick="finalizarOperacion()">✅ Confirmar Carga</button>
    </div>

    <div class="totales-resumen">
        <div class="total-box">
            <span id="resumen-cantidad" class="total-val">0</span>
            <span style="font-size: 9px;">OPERACIONES</span>
        </div>
        <div class="total-box" style="border-color: var(--success);">
            <span id="resumen-ahorro" class="total-val">$ 0,00</span>
            <span style="font-size: 9px;">AHORRO TOTAL</span>
        </div>
    </div>

    <div style="width: 100%; overflow-x: auto;">
        <table>
            <thead>
                <tr><th>Hora</th><th>Carga</th><th>Ahorro</th><th>Final</th></tr>
            </thead>
            <tbody id="log-body"></tbody>
        </table>
    </div>

    <div style="margin-top: 30px; background: #1a1a1a; padding: 15px; border-radius: 10px;">
        <input type="text" id="fileName" placeholder="Nombre_del_Archivo" style="font-size: 14px; padding: 10px; margin-bottom: 10px;">
        <button class="btn btn-export" onclick="descargarYLimpiar()">📥 Descargar Reporte y Vaciar Turno</button>
    </div>
</div>

<script>
    let cuponActivo = null;
    let scanner = new Html5Qrcode("reader");
    let ultimoIdValidado = "";

    // Función de sonido
    function playBeep() {
        try {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } catch(e) { console.log("Audio no soportado"); }
    }

    const config = { fps: 15, qrbox: { width: 250, height: 250 } };
    scanner.start({ facingMode: "environment" }, config, onScanSuccess);

    function onScanSuccess(decodedText) {
        let idCupon = decodedText.split('|')[0] || decodedText;
        
        if (idCupon === ultimoIdValidado) return; // Evitar lecturas múltiples seguidas

        // 1. SEGURIDAD: Verificar en lista negra permanente
        let quemados = JSON.parse(localStorage.getItem('gnc_quemados') || '[]');
        if (quemados.includes(idCupon)) {
            alert("❌ ESTE CUPÓN YA FUE USADO. No se puede reutilizar.");
            return;
        }

        // 2. DETECTAR PORCENTAJE
        let porc = 0;
        if (decodedText.includes("20%")) porc = 20;
        else if (decodedText.includes("15%")) porc = 15;
        else if (decodedText.includes("10%")) porc = 10;
        else if (decodedText.includes("5%")) porc = 5;

        if (porc === 0) return;

        // 3. ÉXITO
        playBeep();
        ultimoIdValidado = idCupon;
        cuponActivo = { id: idCupon, porc: porc };
        
        document.getElementById('status-qr').innerText = "✅ CUPÓN " + porc + "% VALIDADO";
        document.getElementById('status-qr').style.color = "var(--success)";
        document.getElementById('inputMonto').disabled = false;
        document.getElementById('inputMonto').focus();
    }

    function calcularDescuento() {
        const monto = parseFloat(document.getElementById('inputMonto').value);
        if (isNaN(monto) || monto <= 0) {
            document.getElementById('displayCalculo').style.display = 'none';
            document.getElementById('btnFinalizar').classList.add('hidden');
            return;
        }
        const ahorro = (monto * cuponActivo.porc) / 100;
        const total = monto - ahorro;

        document.getElementById('infoDescuento').innerText = `DESCUENTO ${cuponActivo.porc}% (-$${ahorro.toFixed(2)})`;
        document.getElementById('montoFinal').innerText = `$ ${total.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
        document.getElementById('displayCalculo').style.display = 'block';
        document.getElementById('btnFinalizar').classList.remove('hidden');
    }

    function finalizarOperacion() {
        if (!cuponActivo) return;

        const montoOrig = parseFloat(document.getElementById('inputMonto').value);
        const ahorro = (montoOrig * cuponActivo.porc) / 100;
        const total = montoOrig - ahorro;
        const ahora = new Date();
        const horaStr = ahora.getHours() + ":" + ahora.getMinutes().toString().padStart(2, '0');

        const operacion = {
            id: cuponActivo.id,
            hora: horaStr,
            orig: montoOrig,
            ahorro: ahorro,
            final: total
        };

        // GUARDAR HISTORIAL DEL TURNO
        let historial = JSON.parse(localStorage.getItem('gnc_historial') || '[]');
        historial.push(operacion);
        localStorage.setItem('gnc_historial', JSON.stringify(historial));

        // GUARDAR EN LISTA NEGRA PERMANENTE
        let quemados = JSON.parse(localStorage.getItem('gnc_quemados') || '[]');
        quemados.push(cuponActivo.id);
        localStorage.setItem('gnc_quemados', JSON.stringify(quemados));

        // LIMPIAR PARA NUEVA CARGA
        alert("¡Carga guardada con éxito!");
        resetInterfaz();
        renderHistorial();
    }

    function resetInterfaz() {
        cuponActivo = null;
        ultimoIdValidado = "";
        document.getElementById('inputMonto').value = "";
        document.getElementById('inputMonto').disabled = true;
        document.getElementById('displayCalculo').style.display = 'none';
        document.getElementById('btnFinalizar').classList.add('hidden');
        document.getElementById('status-qr').innerText = "[ ESCÁNER ACTIVO ]";
        document.getElementById('status-qr').style.color = "#888";
    }

    function renderHistorial() {
        const datos = JSON.parse(localStorage.getItem('gnc_historial') || '[]');
        const cuerpo = document.getElementById('log-body');
        let totalAhorro = 0;

        cuerpo.innerHTML = [...datos].reverse().map(d => {
            totalAhorro += d.ahorro;
            return `<tr>
                <td>${d.hora}</td>
                <td>$${d.orig.toFixed(2)}</td>
                <td style="color:var(--accent)">-$${d.ahorro.toFixed(2)}</td>
                <td style="color:var(--success); font-weight:bold;">$${d.final.toFixed(2)}</td>
            </tr>`;
        }).join('');

        document.getElementById('resumen-cantidad').innerText = datos.length;
        document.getElementById('resumen-ahorro').innerText = `$ ${totalAhorro.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
    }

    function descargarYLimpiar() {
        const datos = JSON.parse(localStorage.getItem('gnc_historial') || '[]');
        if (datos.length === 0) return alert("No hay datos para exportar.");

        let nombre = document.getElementById('fileName').value.trim() || "Reporte_GNC";
        let csv = "Hora,Monto_Original,Descuento_Pesos,Total_Cobrado,ID_Cupon\n";
        
        datos.forEach(d => {
            csv += `${d.hora},"$${d.orig.toFixed(2)}","-$${d.ahorro.toFixed(2)}","$${d.final.toFixed(2)}",${d.id}\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `${nombre}.csv`;
        link.click();

        setTimeout(() => {
            if (confirm("¿Descarga realizada? Se vaciará la tabla del turno actual.")) {
                localStorage.removeItem('gnc_historial');
                location.reload();
            }
        }, 1000);
    }

    window.onload = renderHistorial;
</script>
</body>
</html>
