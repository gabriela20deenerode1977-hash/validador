<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador GNC - Turno Actual</title>
    
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --text: #e0e0e0;
            --accent: #f1c40f;
            --success: #27ae60;
        }

        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 500px; background: var(--card); padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        h2 { text-align: center; color: var(--accent); margin-bottom: 20px; text-transform: uppercase; font-size: 1.1rem; }
        
        #reader { width: 100%; border-radius: 10px; overflow: hidden; border: 2px solid #444; background: #000; margin-bottom: 15px; }

        .step-box { background: #252525; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #333; }
        .label-step { color: var(--accent); font-weight: bold; font-size: 12px; display: block; margin-bottom: 10px; }
        
        input { width: 100%; padding: 15px; background: #333; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; font-size: 22px; text-align: center; outline: none; }

        .result-display { background: var(--success); color: white; padding: 15px; border-radius: 10px; text-align: center; margin-top: 15px; display: none; }
        .result-display div { font-size: 32px; font-weight: 900; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 14px; margin-top: 10px; }
        .btn-confirm { background: var(--success); color: white; }
        .btn-export { background: #444; color: #ccc; margin-top: 20px; }

        /* Estilo Tabla e Historial */
        .totales-resumen { display: flex; gap: 10px; margin: 20px 0; }
        .total-box { flex: 1; background: #252525; padding: 10px; border-radius: 10px; text-align: center; border-bottom: 3px solid var(--accent); }
        .total-val { display: block; font-size: 18px; font-weight: bold; color: #fff; }
        .total-lbl { font-size: 9px; color: #888; text-transform: uppercase; }

        table { width: 100%; border-collapse: collapse; font-size: 11px; color: #aaa; }
        th { text-align: left; padding: 8px; border-bottom: 1px solid #333; color: var(--accent); }
        td { padding: 8px; border-bottom: 1px solid #222; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Validador de Cupones GNC</h2>

    <div id="step-1" class="step-box">
        <span class="label-step">1. ESCANEAR CUPÓN</span>
        <div id="reader"></div>
        <p id="status-qr" style="text-align: center; font-size: 13px; color: #888;">Esperando QR...</p>
    </div>

    <div id="step-2" class="step-box">
        <span class="label-step">2. MONTO DE CARGA ($)</span>
        <input type="number" id="inputMonto" placeholder="0.00" disabled oninput="calcularDescuento()">
        
        <div id="displayCalculo" class="result-display">
            <small id="infoDescuento"></small>
            <div id="montoFinal">$ 0,00</div>
            <small>MONTO FINAL A COBRAR</small>
        </div>

        <button id="btnFinalizar" class="btn btn-confirm hidden" onclick="finalizarOperacion()">Confirmar Carga</button>
    </div>

    <div class="totales-resumen">
        <div class="total-box">
            <span id="resumen-cantidad" class="total-val">0</span>
            <span class="total-lbl">Canjes</span>
        </div>
        <div class="total-box" style="border-color: var(--success);">
            <span id="resumen-ahorro" class="total-val">$ 0,00</span>
            <span class="total-lbl">Total Descontado</span>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Hora</th>
                <th>Carga</th>
                <th>Desc.</th>
                <th>Final</th>
            </tr>
        </thead>
        <tbody id="log-body"></tbody>
    </table>

    <div style="margin-top: 30px; background: #1a1a1a; padding: 15px; border-radius: 10px;">
        <label style="font-size: 11px; color: var(--accent);">Nombre del Reporte:</label>
        <input type="text" id="fileName" placeholder="Ej: Turno_Manana" style="font-size: 14px; padding: 10px; margin-bottom: 10px;">
        <button class="btn btn-export" onclick="descargarYLimpiar()">📥 Descargar Excel y Limpiar</button>
    </div>
</div>

<script>
    let cuponActivo = null;
    let scanner = new Html5Qrcode("reader");
    let ultimoQr = "";
    let ultimoTiempo = 0;

    const config = { fps: 10, qrbox: { width: 250, height: 250 } };
    scanner.start({ facingMode: "environment" }, config, onScanSuccess);

    function onScanSuccess(decodedText) {
        const ahora = Date.now();
        if (decodedText === ultimoQr && (ahora - ultimoTiempo) < 5000) return;
        ultimoQr = decodedText; ultimoTiempo = ahora;

        let porcentaje = 0;
        if (decodedText.includes("20%")) porcentaje = 20;
        else if (decodedText.includes("15%")) porcentaje = 15;
        else if (decodedText.includes("10%")) porcentaje = 10;
        else if (decodedText.includes("5%")) porcentaje = 5;
        
        if (porcentaje === 0) { alert("❌ Código no válido."); return; }

        cuponActivo = { id: decodedText.split('|')[0] || "ID", porc: porcentaje };
        document.getElementById('status-qr').innerText = "✅ VALIDADO " + porcentaje + "%";
        document.getElementById('inputMonto').disabled = false;
        document.getElementById('inputMonto').focus();
    }

    function calcularDescuento() {
        const monto = parseFloat(document.getElementById('inputMonto').value);
        if (isNaN(monto) || monto <= 0) {
            document.getElementById('displayCalculo').style.display = 'none';
            document.getElementById('btnFinalizar').classList.add('hidden');
            return;
        }
        const ahorro = (monto * cuponActivo.porc) / 100;
        const total = monto - ahorro;

        document.getElementById('infoDescuento').innerText = `DESCUENTO ${cuponActivo.porc}% (-$${ahorro.toFixed(2)})`;
        document.getElementById('montoFinal').innerText = `$ ${total.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
        document.getElementById('displayCalculo').style.display = 'block';
        document.getElementById('btnFinalizar').classList.remove('hidden');
    }

    function finalizarOperacion() {
        const montoOrig = parseFloat(document.getElementById('inputMonto').value);
        const ahorro = (montoOrig * cuponActivo.porc) / 100;
        const total = montoOrig - ahorro;
        const ahora = new Date();
        const horaString = ahora.getHours() + ":" + ahora.getMinutes().toString().padStart(2, '0');

        const operacion = {
            hora: horaString,
            original: montoOrig,
            descuento: cucupoActivo.porc,
            ahorro: ahorro,
            final: total,
            id: cuponActivo.id
        };

        let db = JSON.parse(localStorage.getItem('gnc_validaciones') || '[]');
        db.push(operacion);
        localStorage.setItem('gnc_validaciones', JSON.stringify(db));

        // Reset
        document.getElementById('inputMonto').value = "";
        document.getElementById('inputMonto').disabled = true;
        document.getElementById('displayCalculo').style.display = 'none';
        document.getElementById('btnFinalizar').classList.add('hidden');
        document.getElementById('status-qr').innerText = "Esperando QR...";
        renderTable();
    }

    function renderTable() {
        const datos = JSON.parse(localStorage.getItem('gnc_validaciones') || '[]');
        const cuerpo = document.getElementById('log-body');
        let ahorroAcumulado = 0;

        cuerpo.innerHTML = [...datos].reverse().map(d => {
            ahorroAcumulado += d.ahorro;
            return `
                <tr>
                    <td>${d.hora}</td>
                    <td>$${d.original.toFixed(2)}</td>
                    <td style="color:var(--accent)">-$${d.ahorro.toFixed(2)}</td>
                    <td style="color:var(--success); font-weight:bold;">$${d.final.toFixed(2)}</td>
                </tr>
            `;
        }).join('');

        document.getElementById('resumen-cantidad').innerText = datos.length;
        document.getElementById('resumen-ahorro').innerText = `$ ${ahorroAcumulado.toLocaleString('es-AR', {minimumFractionDigits: 2})}`;
    }

    function descargarYLimpiar() {
        const datos = JSON.parse(localStorage.getItem('gnc_validaciones') || '[]');
        if (datos.length === 0) return alert("No hay datos.");

        let nombre = document.getElementById('fileName').value.trim() || "Reporte_GNC";
        let csv = "Hora,Monto_Original,Descuento_Pesos,Monto_Final_Cobrado\n";
        
        datos.forEach(d => {
            // Formato moneda para Excel
            csv += `${d.hora},"$${d.original.toFixed(2)}","-$${d.ahorro.toFixed(2)}","$${d.final.toFixed(2)}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `${nombre}.csv`;
        link.click();

        setTimeout(() => {
            if (confirm("¿Descarga OK? Se vaciará el historial.")) {
                localStorage.removeItem('gnc_validaciones');
                location.reload();
            }
        }, 1000);
    }

    window.onload = renderTable;
</script>
</body>
</html>
