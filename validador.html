<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Validador PRO</title>

<style>
body{
  background:#111;
  color:white;
  text-align:center;
  font-family:Arial;
}

#reader{
  width:320px;
  margin:20px auto;
}

#resultado{
  margin-top:20px;
  font-size:24px;
  font-weight:bold;
}

.ok{color:#00e676;}
.bad{color:#ff5252;}
</style>
</head>

<body>

<h2>ESCANEAR CUPÓN</h2>

<div id="reader"></div>

<h3 id="resultado">Esperando escaneo...</h3>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
const URL = "https://script.google.com/macros/s/AKfycbxoH0OTGnOEOHFCXrxOKDjuflGaJ3pJZIjRitz_RfsJudlWYY04MRcfvw9ImEXoCQrf/exec";

const resultado = document.getElementById("resultado");

async function validar(codigo){

  resultado.innerText = "Validando...";

  try{
    const res = await fetch(URL + "?codigo=" + codigo);
    const txt = await res.text();

    if(txt.includes("VALIDO")){
      resultado.innerText = "✅ " + txt;
      resultado.className = "ok";
    }else{
      resultado.innerText = "❌ " + txt;
      resultado.className = "bad";
    }

  }catch{
    resultado.innerText = "Error de conexión";
    resultado.className = "bad";
  }
}

function onScanSuccess(decodedText) {
  validar(decodedText);
}

const qr = new Html5Qrcode("reader");

Html5Qrcode.getCameras().then(devices => {
  if (devices.length) {
    qr.start(
      devices[0].id,
      { fps: 10, qrbox: 250 },
      onScanSuccess
    );
  }
});
</script>

</body>
</html>
